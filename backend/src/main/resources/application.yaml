spring:
  application:
    name: horse-transport-system

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: horse-transport-system
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_CHECKOUT_SUCCESS_URL:http://localhost:5173/payment/success}
      cancel-url: ${STRIPE_CHECKOUT_CANCEL_URL:http://localhost:5173/payment/cancelled}
